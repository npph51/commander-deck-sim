# Plays the games. Started by hand only (workflow_dispatch): no schedule, no push or pull-request trigger, no secrets.
name: Deck sim
# The starter's own number for the run, so it finds its run among several (nothing else is in the name).
run-name: Deck sim ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke, test (the deck against precons) or calib (precons among themselves)'
        type: choice
        options: [test, calib, smoke]
        default: test
      decklist:
        description: 'The deck under test, in Forge .dck format (commander and main sections)'
        default: ''
      pods:
        description: 'Tables of four (at most 200)'
        default: '20'
      games:
        description: 'Games per table (at most 20)'
        default: '5'
      clock:
        description: 'Seconds before a game is called a draw'
        default: '420'
      profile:
        description: 'Forge AI profile for every seat'
        type: choice
        options: ['', Default, Cautious, Reckless, Experimental, Hard, Hardest]
        default: ''
      machines:
        description: 'Machines playing side by side (at most 20); the tables are shared out among them'
        default: '20'
      seed:
        description: 'Seed for which precons sit at which table'
        default: '1'
      pool:
        description: 'Which official decks sit at the tables: classic (the first twelve), standard, strong, all (calib only)'
        default: 'classic'
      workers:
        description: 'Tables played side by side on each machine (1 to 4: a machine has four cores)'
        default: '1'
      tag:
        description: 'A number the starter gives the run, shown in its name'
        default: ''
permissions:
  contents: read
env:
  MODE: ${{ inputs.mode }}
  DECKLIST: ${{ inputs.decklist }}
  PODS: ${{ inputs.pods }}
  GAMES: ${{ inputs.games }}
  CLOCK: ${{ inputs.clock }}
  PROFILE: ${{ inputs.profile }}
  SEED: ${{ inputs.seed }}
  WORKERS: ${{ inputs.workers }}
  POOL: ${{ inputs.pool }}
jobs:
  # Fetches Forge's release once (kept in the cache per release) and says how many machines play.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MACHINES: ${{ inputs.machines }}
        run: |
          n=$(python3 -c "import os; m=os.environ; print(max(1, min(20, int(m.get('MACHINES') or 20), int(m.get('PODS') or 20))) if m.get('MODE') != 'smoke' else 1)")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"
          echo "tag=$(gh release view -R Card-Forge/forge --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: forge.tar.bz2
          key: forge-${{ steps.plan.outputs.tag }}
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R Card-Forge/forge -p '*.tar.bz2' -O forge.tar.bz2
  play:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: forge.tar.bz2
          key: forge-${{ needs.setup.outputs.tag }}
          fail-on-cache-miss: true
      - name: Play
        env:
          STAGE: play
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.setup.outputs.count }}
        run: |
          sudo apt-get install -y -qq xvfb bzip2 >/dev/null
          mkdir forge && tar -xjf forge.tar.bz2 -C forge && rm -f forge.tar.bz2
          python3 run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: records-${{ matrix.shard }}
          path: records/
          retention-days: 1
  # One summary from every machine's games; machines that failed are simply missing from it.
  summary:
    needs: [setup, play]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: forge.tar.bz2
          key: forge-${{ needs.setup.outputs.tag }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: records-*
          path: records
          merge-multiple: true
      - name: Summary
        env:
          STAGE: merge
          SHARDS: ${{ needs.setup.outputs.count }}
        run: |
          mkdir forge && tar -xjf forge.tar.bz2 -C forge
          python3 run.py
