# Plays the games. Started by hand only (workflow_dispatch): no schedule, no push or pull-request trigger, no secrets.
name: Deck sim
# The starter's own number for the run, so it finds its run among several (nothing else is in the name).
run-name: Deck sim ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke, test (the deck against precons) or calib (precons among themselves)'
        type: choice
        options: [test, calib, ladder, smoke]
        default: test
      decklist:
        description: 'The deck under test, in Forge .dck format (commander and main sections)'
        default: ''
      pods:
        description: 'Tables of four (at most 200)'
        default: '20'
      games:
        description: 'Games per table (at most 20)'
        default: '5'
      clock:
        description: 'Seconds before a game is called a draw'
        default: '420'
      profile:
        description: 'Forge AI profile for every seat'
        type: choice
        options: ['', Default, Cautious, Reckless, Experimental, Hard, Hardest]
        default: ''
      mc:
        description: "Forge's Flat Monte Carlo layer for every seat (blank = off, as Forge has it in simulations)"
        type: choice
        options: ['', 'on', 'max', 'off']
        default: ''
      machines:
        description: 'Machines playing side by side (at most 20); the tables are shared out among them'
        default: '20'
      seed:
        description: 'Seed for which precons sit at which table'
        default: '1'
      pool:
        description: 'Which official decks sit at the tables: classic (the first twelve), standard, bracket2 (standard without the decks above Bracket 2), strong, all (calib only)'
        default: 'classic'
      workers:
        description: 'Tables played side by side on each machine (1 to 4: a machine has four cores)'
        default: '1'
      tag:
        description: 'A number the starter gives the run, shown in its name'
        default: ''
      budget:
        description: 'Minutes a machine plays before it starts no new table (0 = no limit); tables still playing 10 minutes later hand in what they finished'
        default: '0'
      average:
        description: 'test: a commander name; that commander''s average player deck (as Forge offers it for download) is tested in place of a list'
        default: ''
      extra:
        description: 'ladder: commanders whose average decks sit down as subjects, names separated by | (pool bracket2: against the 23 decks within Bracket 2, beside the five left out of it; else against the 28 standard decks, beside the premium precons)'
        default: ''
      swaps:
        description: 'test: card swaps to try side by side, as JSON [[card out, card in], ...] (a group made as one: [[out, in], [out, in]]); each table plays a random half of them'
        default: ''
      skip:
        description: 'Tables of the seeded deal to pass over, so a second part of a test plays the next ones'
        default: '0'
      mc_seats:
        description: 'With mc on: all (every seat) or ours (only the deck under test; the others on a profile without it)'
        default: 'all'
      combos:
        description: 'Combos to follow in the deck under test, as JSON [[card, card, ...], ...]'
        default: ''
      teach:
        description: 'on = also write those combos into Forge''s own list of combos (ai-combos.txt)'
        default: ''
      pergame:
        description: 'test: 1 = every game its own Forge start and seed (the default), 2 = one Forge start per table with every game on its own seed, 0 = one Forge start per table'
        default: '1'
      forge:
        description: "Which Forge: blank = Card-Forge's newest release; fork = our fork npph51/forge, branch commander; fork:<branch or commit> = another ref of the fork (built once, then cached by its commit)"
        default: ''
      opts:
        description: 'Timing switches, comma-separated: lazy (card scripts read when needed), serialgc, c1. Empty = none'
        default: ''
permissions:
  contents: read
env:
  MODE: ${{ inputs.mode }}
  DECKLIST: ${{ inputs.decklist }}
  PODS: ${{ inputs.pods }}
  GAMES: ${{ inputs.games }}
  CLOCK: ${{ inputs.clock }}
  PROFILE: ${{ inputs.profile }}
  MC: ${{ inputs.mc }}
  SEED: ${{ inputs.seed }}
  WORKERS: ${{ inputs.workers }}
  POOL: ${{ inputs.pool }}
  BUDGET: ${{ inputs.budget }}
  SKIP: ${{ inputs.skip }}
  SWAPS: ${{ inputs.swaps }}
  AVERAGE: ${{ inputs.average }}
  EXTRA: ${{ inputs.extra }}
  MC_SEATS: ${{ inputs.mc_seats }}
  COMBOS: ${{ inputs.combos }}
  TEACH: ${{ inputs.teach }}
  PERGAME: ${{ inputs.pergame }}
  OPTS: ${{ inputs.opts }}
  FORGE: ${{ inputs.forge }}
jobs:
  # Fetches Forge's release once (kept in the cache per release) and says how many machines play.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      tag: ${{ steps.plan.outputs.tag }}
      src: ${{ steps.plan.outputs.src }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MACHINES: ${{ inputs.machines }}
        run: |
          n=$(python3 -c "import os; m=os.environ; print(max(1, min(20, int(m.get('MACHINES') or 20), int(m.get('PODS') or 20))) if m.get('MODE') != 'smoke' else 1)")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"
          case "$FORGE" in
            fork|fork:*)
              ref="${FORGE#fork}"; ref="${ref#:}"; ref="${ref:-commander}"
              sha=$(git ls-remote https://github.com/npph51/forge.git "$ref" | head -1 | cut -f1)
              [ -n "$sha" ] || sha="$ref"
              case "$sha" in *[!0-9a-f]*|'') echo "no such ref on the fork: $ref"; exit 1;; esac
              echo "tag=fork-$sha" >> "$GITHUB_OUTPUT"
              echo "src=npph51/forge/$sha" >> "$GITHUB_OUTPUT"
              echo "sha=$sha" >> "$GITHUB_OUTPUT";;
            '')
              echo "tag=$(gh release view -R Card-Forge/forge --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
              echo "src=" >> "$GITHUB_OUTPUT";;
            *) echo "forge must be blank, fork or fork:<ref>"; exit 1;;
          esac
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: forge.tar.bz2
          key: forge-${{ steps.plan.outputs.tag }}
      - if: steps.cache.outputs.cache-hit != 'true' && steps.plan.outputs.sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R Card-Forge/forge -p '*.tar.bz2' -O forge.tar.bz2
      # The fork: built from source once per commit (the desktop jar and its res folder, laid out as the release is).
      - if: steps.cache.outputs.cache-hit != 'true' && steps.plan.outputs.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: npph51/forge
          ref: ${{ steps.plan.outputs.sha }}
          path: forge-src
          persist-credentials: false
      - if: steps.cache.outputs.cache-hit != 'true' && steps.plan.outputs.sha != ''
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: forge-src/**/pom.xml
      - if: steps.cache.outputs.cache-hit != 'true' && steps.plan.outputs.sha != ''
        name: Build the fork
        working-directory: forge-src
        run: |
          mvn -B -q -pl forge-gui-desktop -am package -DskipTests -Dskip.flatten=true -Dmaven.javadoc.skip=true -T 1C
          mkdir ../forge-out
          cp forge-gui-desktop/target/forge-gui-desktop-*-jar-with-dependencies.jar ../forge-out/
          cp -r forge-gui/res ../forge-out/res
          ls ../forge-out
          cd .. && tar -cjf forge.tar.bz2 -C forge-out . && ls -la forge.tar.bz2
  play:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: forge.tar.bz2
          key: forge-${{ needs.setup.outputs.tag }}
          fail-on-cache-miss: true
      - name: Play
        env:
          STAGE: play
          FORGE_SRC: ${{ needs.setup.outputs.src }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.setup.outputs.count }}
        run: |
          sudo apt-get install -y -qq xvfb bzip2 >/dev/null
          mkdir forge && tar -xjf forge.tar.bz2 -C forge && rm -f forge.tar.bz2
          python3 run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Also when the machine was cut off: its games so far are on disk.
        if: always()
        with:
          name: records-${{ matrix.shard }}
          path: records/
          retention-days: 1
  # One summary from every machine's games; machines that failed are simply missing from it.
  summary:
    needs: [setup, play]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: forge.tar.bz2
          key: forge-${{ needs.setup.outputs.tag }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: records-*
          path: records
          merge-multiple: true
      - name: Summary
        env:
          STAGE: merge
          FORGE_SRC: ${{ needs.setup.outputs.src }}
          SHARDS: ${{ needs.setup.outputs.count }}
        run: |
          mkdir forge && tar -xjf forge.tar.bz2 -C forge
          python3 run.py
